# Shape of a Win32 rig descriptor. This file is an example; it is never loaded.
#
# Keep the real file outside the repository, in the local rig directory:
#
#   ~/.config/loka/rigs/win32/<rig>.ini      (override with LOKA_WIN32_RIG_HOME)
#
# and select it per run with LOKA_WIN32_RIG=<rig>.
#
# Descriptors live outside the repository for the same reason the goldens they
# pin do: both are facts about one machine, and no other machine can use them.
# A tracked descriptor would also make everyone who clones this repository
# carry someone else's rig.
#
# The trade this makes: the environment a golden is pinned to is no longer a
# reviewable file. Widening what the rail accepts -- dropping a [capture] field
# -- becomes a local edit nobody reviews. What still holds is that the rail
# refuses before it bakes: an undeclared or disagreeing machine cannot write a
# golden.

[rig]
descriptor_version = 1
rig_id = local-example
build_architecture = x64
build_profile = win32-debug
capture_adapter = PrintWindow.PW_RENDERFULLCONTENT.v1
artifact_contract_version = 1

# Every field here is compared against the profile the scenario vehicle reports,
# before a golden is written or compared. Without it the rail records whatever
# the desktop happened to be at bake time and only discovers the disagreement on
# the next comparison -- by which point the wrong value is the baseline. That
# already happened once: captures on 2026-08-21 recorded appearance=dark and the
# 2026-08-22 bake recorded appearance=light, on the same machine, because the
# desktop theme moved in between.
#
# A field left out of this section is not checked. Adding one narrows what the
# rail will accept; removing one widens it. Take the values from the
# actual.profile a refused run leaves beside its capture -- do not invent them.
[capture]
os_build = 10.0.00000
arch = x64
scale_percent = 100
depth = 32
appearance = light
