[local]
# Keep the real file outside the repository or under the ignored build tree.
vm_host_ssh = tahoe-alias
vm_name = Local VM Name
target_host = auto
target_user = local-user
target_identity_file = /absolute/host/path/to/ssh-key
target_proxy_ssh = tahoe-alias
target_legacy_rsa = true
target_root = /Users/local-user/loka-rig
archive_root = /absolute/host/path/loka-rig-archive

# Optional local facts. They are recorded in the manifest when supplied.
vm_snapshot =
target_python = /absolute/path/to/python3
