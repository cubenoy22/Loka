[rig]
descriptor_version = 1
rig_id = tahoe
os_version = 26.6.1
os_build = 25G76
machine = x86_64
build_architecture = x86_64
build_profile = macos-debug
supported_modes = inspect,flow
disposable_for_input = false
capture_adapter = NSView.cacheDisplayInRect.v1
recording_adapter = none
artifact_contract_version = 1

# The capture environment the macOS goldens are pinned to.
#
# Every field here is compared against the profile the scenario vehicle
# reports, before a golden is written or compared. Without it the rail records
# whatever the desktop happened to be at bake time and only discovers the
# disagreement on the next comparison -- by which point the wrong value is the
# baseline. That already happened once on Win32: captures on 2026-08-21
# recorded appearance=dark and the 2026-08-22 bake recorded appearance=light,
# on the same machine, because the desktop theme moved in between.
#
# A field left out of this section is not checked. Adding one narrows what the
# rail will accept; removing one widens it. Both belong in review, which is why
# this file is tracked and the profiles beside the goldens are not.
[capture]
profile_version = 2
os_build = 25G76
arch = x86_64
scale_percent = 200
depth = 24
appearance = light
capture_api = NSView.cacheDisplayInRect.v1
