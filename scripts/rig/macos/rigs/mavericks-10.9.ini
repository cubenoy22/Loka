[rig]
descriptor_version = 1
rig_id = mavericks-10.9
os_version = 10.9.5
os_build = 13F1911
machine = x86_64
build_architecture = i386
build_profile = macos-10.6-sdk-i386
supported_modes = inspect,flow
disposable_for_input = false
capture_adapter = NSView.cacheDisplayInRect.v1
recording_adapter = none
artifact_contract_version = 1

# The capture environment the Mavericks goldens are pinned to, measured on the
# rig on 2026-08-22 rather than chosen. Every field here is compared against
# the profile the scenario vehicle reports, before a golden is written or
# compared; see tahoe.ini for why a field left out is not checked.
#
# This section was deliberately absent until now: no capture had ever been
# recorded here, and an invented value is worse than none, because the guard
# would then pass a bake against a number nobody measured.
#
# appearance_available is declared, and appearance is not. 10.9 predates the
# 10.14 appearance API, so the vehicle reports the fact as absent rather than
# reporting a value. Pinning the absence is the point: if a future build on
# this rig gains appearance reporting, the desktop theme starts reaching the
# capture, and goldens baked before that are no longer comparable. Without
# this line that change arrives as a confusing pixel diff instead of a
# refusal, which is the failure #460 closed on Win32.
[capture]
profile_version = 2
os_build = 13F1911
arch = x86_64
scale_percent = 100
depth = 24
appearance_available = 0
capture_api = NSView.cacheDisplayInRect.v1
