name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # No build can catch a reintroduced side-effect assert: it compiles, and
      # under NDEBUG it just makes a test check less than it claims (#264).
      - run: python3 tools/ci/check_test_asserts.py
      - run: cmake --preset testing
      - run: cmake --build --preset testing
      - run: ctest --preset testing --output-on-failure

  linux-asan:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: cmake --preset testing-asan
      - run: cmake --build --preset testing-asan
      - run: ctest --preset testing-asan --output-on-failure

  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: cmake --preset testing-release
      - run: cmake --build --preset testing-release
      - run: ctest --preset testing-release --output-on-failure

  macos:
    runs-on: macos-15
    # A failing assert in a Debug GUI-adjacent test can leave an unattended
    # dialog waiting forever. Bound the job so that failure cannot hang the
    # hosted runner for the workflow's maximum duration.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: cmake --preset macos-debug
      # As on Win32, the production build excludes the test executable and
      # the test target covers only a slice of the platform layer. Build both
      # target sets so CI proves the application and the tests still build.
      - run: cmake --build --preset macos-debug
      - run: cmake --build --preset macos-tests
      - run: ctest --preset macos-tests --output-on-failure
      # Hosted runners have no persistent display-profile golden. They still
      # prove the real AppKit runner, bounded settle, exact audit, profile,
      # and atomic completion contract; Tahoe owns the pixel verdict.
      - run: cmake --build --preset macos-scenarios
      - run: tests/macos/run-scenario.sh startup --ci-structural
      - run: tests/macos/run-scenario.sh flip-forward-back --ci-structural
      - name: Upload macOS scenario failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-scenario-artifacts
          path: build/macos-scenario/
          if-no-files-found: ignore

  win32:
    runs-on: windows-latest
    # A failing assert in an MSVC Debug build raises an abort dialog, which on
    # a hosted runner waits forever instead of failing. Without this bound a
    # red Win32 test hangs the job for the workflow's maximum duration.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Verify Ninja
        run: ninja --version
      - run: cmake --preset win32-debug
      # Two builds, because neither target set implies the other: win32-debug
      # builds the production targets (the test executable compiles only a
      # slice of the platform layer, so a green test run alone would not mean
      # the app still builds), while win32-tests builds LokaTestsWin32, which
      # win32-debug does not.
      - run: cmake --build --preset win32-debug
      - run: cmake --build --preset win32-tests
      # Hosted CI does not cover the local rig's ARM64 build or ACP=932
      # full-width-path behavior; those remain manually verified per #172.
      - run: ctest --preset win32-tests --output-on-failure
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/scripts/Win32PresentationStageTest.ps1
